plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "9"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "3.0.1"

android {
    namespace "com.ritmo.mobile"
    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    defaultConfig {
        applicationId "com.ritmo.mobile"
        minSdk 24
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }
    signingConfigs {
        ritmoRelease {
            storeFile file("../../signing/ritmo.keystore")
            storePassword "ritmo2026app"
            keyAlias "ritmo"
            keyPassword "ritmo2026app"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.ritmoRelease }
        release {
            signingConfig signingConfigs.ritmoRelease
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter { source "../.." }
