name: Ritmo 3.4.2 Validation

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ contains(github.event.head_commit.message, 'Ritmo 3.4.2 strict validation') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply final tidy
        run: python .github/scripts/final_tidy_3_4_2.py

      - name: Fetch packages
        run: flutter pub get

      - name: Configure Android local.properties
        shell: bash
        run: |
          cat > android/local.properties <<EOF2
          flutter.sdk=$FLUTTER_ROOT
          flutter.versionCode=14
          flutter.versionName=3.4.2
          EOF2

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Regression tests
        run: flutter test

      - name: Validate Android native integration
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Commit validated tidy
        shell: bash
        run: |
          git config user.name "Ritmo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset -- android/local.properties
          git reset -- .github/workflows
          git reset -- .github/scripts/final_tidy_3_4_2.py
          git commit -m "fix: finalize Ritmo 3.4.2 validated polish"
          git push origin main
