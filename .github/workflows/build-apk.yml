name: Build Ritmo Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true
      - name: Flutter diagnostics
        run: flutter doctor -v
      - name: Fetch packages
        run: flutter pub get
      - name: Configure Android local.properties
        shell: bash
        run: |
          cat > android/local.properties <<EOF2
          flutter.sdk=$FLUTTER_ROOT
          flutter.versionCode=14
          flutter.versionName=3.4.2
          EOF2
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test Flutter source
        run: flutter test
      - name: Build signed release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Collect APK
        shell: bash
        run: |
          APK="$(find build -type f -name 'app-release.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" Ritmo-v3.4.2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ritmo-v3.4.2-APK
          path: Ritmo-v3.4.2.apk
          if-no-files-found: error
          retention-days: 30
