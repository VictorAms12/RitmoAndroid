name: Apply Ritmo 3.3 Combined Upgrade

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply 3.3 source upgrade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_name, old, new, label):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if new in text:
                  print('already applied:', label)
                  return
              if old not in text:
                  raise SystemExit('expected block not found: ' + label + ' in ' + path_name)
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('updated:', label)

          replace('lib/models/models.dart',
                  "  bool flexible;\n  List<Subtask> subtasks;",
                  "  bool flexible;\n  bool inbox;\n  String energy;\n  String preferredPeriod;\n  List<Subtask> subtasks;",
                  'task model fields')
          replace('lib/models/models.dart',
                  "    this.flexible = false,\n    List<Subtask>? subtasks,",
                  "    this.flexible = false,\n    this.inbox = false,\n    this.energy = 'medium',\n    this.preferredPeriod = 'any',\n    List<Subtask>? subtasks,",
                  'task constructor fields')
          replace('lib/models/models.dart',
                  "      reminderMinutes: (j['reminderMinutes'] as num?)?.toInt() ?? -1,\n      flexible: j['flexible'] == true,\n      subtasks:",
                  "      reminderMinutes: (j['reminderMinutes'] as num?)?.toInt() ?? -1,\n      flexible: j['flexible'] == true,\n      inbox: j['inbox'] == true,\n      energy: (j['energy'] ?? 'medium').toString(),\n      preferredPeriod: (j['preferredPeriod'] ?? 'any').toString(),\n      subtasks:",
                  'task json read')
          replace('lib/models/models.dart',
                  "        'reminderMinutes': reminderMinutes,\n        'flexible': flexible,\n        'subtasks':",
                  "        'reminderMinutes': reminderMinutes,\n        'flexible': flexible,\n        'inbox': inbox,\n        'energy': energy,\n        'preferredPeriod': preferredPeriod,\n        'subtasks':",
                  'task json write')
          replace('lib/models/models.dart', "        'schemaVersion': 7,", "        'schemaVersion': 8,", 'schema version')

          replace('lib/sheets/editors.dart',
                  "  late bool _flexible;\n  late int _projectId;",
                  "  late bool _flexible;\n  late bool _inbox;\n  late String _energy;\n  late String _preferredPeriod;\n  late int _projectId;",
                  'editor state fields')
          replace('lib/sheets/editors.dart',
                  "    _date = t?.date ?? widget.initialDate ?? widget.state.today;\n    _deadline = t?.deadline ?? _date;",
                  "    _date = t?.inbox == true ? widget.state.today : (t?.date ?? widget.initialDate ?? widget.state.today);\n    _deadline = t?.inbox == true ? widget.state.today : (t?.deadline ?? _date);",
                  'editor inbox dates')
          replace('lib/sheets/editors.dart',
                  "    _flexible = t?.flexible ?? !widget.commitment;\n    _projectId = t?.projectId ?? 0;",
                  "    _flexible = t?.flexible ?? !widget.commitment;\n    _inbox = t?.inbox ?? false;\n    _energy = t?.energy ?? 'medium';\n    _preferredPeriod = t?.preferredPeriod ?? 'any';\n    _projectId = t?.projectId ?? 0;",
                  'editor planner metadata init')
          replace('lib/sheets/editors.dart',
                  "      date: _date,\n      time: _time,\n      deadline: _deadline.compareTo(_date) < 0 ? _date : _deadline,",
                  "      date: _inbox ? '2999-12-31' : _date,\n      time: _inbox ? '' : _time,\n      deadline: _inbox ? '2999-12-31' : (_deadline.compareTo(_date) < 0 ? _date : _deadline),",
                  'editor inbox save dates')
          replace('lib/sheets/editors.dart',
                  "      reminderMinutes: _reminder,\n      flexible: _flexible && _recurrence == 'none',\n      subtasks:",
                  "      reminderMinutes: _inbox ? -1 : _reminder,\n      flexible: _inbox ? true : (_flexible && _recurrence == 'none'),\n      inbox: _inbox,\n      energy: _energy,\n      preferredPeriod: _preferredPeriod,\n      subtasks:",
                  'editor planner metadata save')

          marker = "              onChanged: (v) => setState(() => _priority = v ?? _priority),\n            ),\n            const SizedBox(height: 10),\n            DropdownButtonFormField<String>(\n              initialValue: _recurrence,"
          controls = "              onChanged: (v) => setState(() => _priority = v ?? _priority),\n            ),\n            const SizedBox(height: 10),\n            Row(\n              children: [\n                Expanded(\n                  child: DropdownButtonFormField<String>(\n                    initialValue: _energy,\n                    decoration: const InputDecoration(labelText: 'Energia', prefixIcon: Icon(Icons.bolt_outlined)),\n                    items: const [\n                      DropdownMenuItem(value: 'low', child: Text('Baixa')),\n                      DropdownMenuItem(value: 'medium', child: Text('Média')),\n                      DropdownMenuItem(value: 'high', child: Text('Alta')),\n                    ],\n                    onChanged: (v) => setState(() => _energy = v ?? _energy),\n                  ),\n                ),\n                const SizedBox(width: 10),\n                Expanded(\n                  child: DropdownButtonFormField<String>(\n                    initialValue: _preferredPeriod,\n                    decoration: const InputDecoration(labelText: 'Melhor período', prefixIcon: Icon(Icons.schedule_outlined)),\n                    items: const [\n                      DropdownMenuItem(value: 'any', child: Text('Qualquer')),\n                      DropdownMenuItem(value: 'morning', child: Text('Manhã')),\n                      DropdownMenuItem(value: 'afternoon', child: Text('Tarde')),\n                      DropdownMenuItem(value: 'evening', child: Text('Noite')),\n                    ],\n                    onChanged: (v) => setState(() => _preferredPeriod = v ?? _preferredPeriod),\n                  ),\n                ),\n              ],\n            ),\n            const SizedBox(height: 10),\n            SwitchListTile.adaptive(\n              value: _inbox,\n              onChanged: widget.commitment ? null : (v) => setState(() => _inbox = v),\n              contentPadding: const EdgeInsets.symmetric(horizontal: 8),\n              title: const Text('Caixa de entrada'),\n              subtitle: const Text('Salva sem data e deixa para você organizar depois.'),\n              secondary: const Icon(Icons.inbox_outlined),\n            ),\n            const SizedBox(height: 6),\n            DropdownButtonFormField<String>(\n              initialValue: _recurrence,"
          replace('lib/sheets/editors.dart', marker, controls, 'editor smart controls')

          replace('lib/screens/today_page.dart',
                  "import 'focus_page.dart';",
                  "import 'focus_page.dart';\nimport 'command_center_page.dart';",
                  'today command center import')
          old_theme = "                    IconButton.filledTonal(\n                      tooltip: 'Alternar tema',\n                      onPressed: () {\n                        final next = state.themeMode == RitmoThemeMode.dark\n                            ? RitmoThemeMode.light\n                            : RitmoThemeMode.dark;\n                        state.setTheme(next);\n                      },\n                      icon: Icon(\n                        Theme.of(context).brightness == Brightness.dark\n                            ? Icons.light_mode_rounded\n                            : Icons.dark_mode_rounded,\n                      ),\n                    ),"
          new_theme = "                    Row(\n                      mainAxisSize: MainAxisSize.min,\n                      children: [\n                        IconButton.filledTonal(\n                          tooltip: 'Central',\n                          onPressed: () => Navigator.of(context).push(\n                            MaterialPageRoute(builder: (_) => CommandCenterPage(state: state)),\n                          ),\n                          icon: const Icon(Icons.dashboard_customize_outlined),\n                        ),\n                        const SizedBox(width: 7),\n                        IconButton.filledTonal(\n                          tooltip: 'Alternar tema',\n                          onPressed: () {\n                            final next = state.themeMode == RitmoThemeMode.dark\n                                ? RitmoThemeMode.light\n                                : RitmoThemeMode.dark;\n                            state.setTheme(next);\n                          },\n                          icon: Icon(\n                            Theme.of(context).brightness == Brightness.dark\n                                ? Icons.light_mode_rounded\n                                : Icons.dark_mode_rounded,\n                          ),\n                        ),\n                      ],\n                    ),"
          replace('lib/screens/today_page.dart', old_theme, new_theme, 'today central button')

          org = Path('lib/screens/organizer_page.dart')
          org_text = org.read_text(encoding='utf-8')
          if "import 'smart_planner_tab.dart';" not in org_text:
              org_text = org_text.replace("import 'settings_page.dart';", "import 'settings_page.dart';\nimport 'smart_planner_tab.dart';", 1) if "import 'settings_page.dart';" in org_text else org_text.replace("import '../widgets/common.dart';", "import '../widgets/common.dart';\nimport 'smart_planner_tab.dart';", 1)
          start = org_text.index('class _PlannerTab extends StatelessWidget {')
          end = org_text.index('class _KanbanTab extends StatelessWidget {')
          wrapper = "class _PlannerTab extends StatelessWidget {\n  final AppState state;\n  const _PlannerTab({required this.state});\n\n  @override\n  Widget build(BuildContext context) => SmartPlannerTab(state: state);\n}\n\n"
          org.write_text(org_text[:start] + wrapper + org_text[end:], encoding='utf-8')
          print('updated: organizer planner wrapper')

          replace('pubspec.yaml', 'version: 3.0.2+10', 'version: 3.3.0+11', 'pubspec version')
          replace('android/app/build.gradle',
                  'localProperties.getProperty("flutter.versionCode") ?: "10"',
                  'localProperties.getProperty("flutter.versionCode") ?: "11"',
                  'android version code')
          replace('android/app/build.gradle',
                  'localProperties.getProperty("flutter.versionName") ?: "3.0.2"',
                  'localProperties.getProperty("flutter.versionName") ?: "3.3.0"',
                  'android version name')
          replace('lib/screens/settings_page.dart', "title: const Text('Ritmo 3.0.2'),", "title: const Text('Ritmo 3.3.0'),", 'settings version')
          replace('lib/screens/settings_page.dart',
                  "'Primeira versão reconstruída em Flutter · dados locais · sem conta obrigatória.',",
                  "'Inbox, busca global, timeline e Smart Planner 2.0 · dados locais · sem conta obrigatória.',",
                  'settings summary')
          PY

      - name: Commit combined upgrade
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes were needed."
            exit 0
          fi
          git config user.name "Ritmo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/models/models.dart lib/sheets/editors.dart lib/screens/today_page.dart lib/screens/organizer_page.dart lib/screens/settings_page.dart pubspec.yaml android/app/build.gradle
          git commit -m "feat: Ritmo 3.3 combina UX diária e Smart Planner 2.0"
          git push origin main
