name: Apply Ritmo 3.4.1 Polish

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ contains(github.event.head_commit.message, 'run Ritmo 3.4.1 polish') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - name: Install icon tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply audit fixes
        run: python .github/scripts/polish_v3_4_1.py

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Commit polished version
        shell: bash
        run: |
          git config user.name "VictorAms12"
          git config user.email "victoralexandresoaresmaranhao@gmail.com"
          git add -A
          git reset -- .github/workflows/apply-polish-v3.4.1.yml
          git commit -m "fix: Ritmo 3.4.1 estabilidade desempenho e novo icone"
          git push origin main
