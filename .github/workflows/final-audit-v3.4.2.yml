name: Ritmo 3.4.2 Final Audit

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  audit:
    if: ${{ contains(github.event.head_commit.message, 'start Ritmo 3.4.2 final audit') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Patch audited issues
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def rd(p): return Path(p).read_text(encoding='utf-8')
          def wr(p,s): Path(p).write_text(s,encoding='utf-8',newline='\n')
          def swap(p,a,b,label):
              s=rd(p)
              if b in s: print('ok',label); return
              if a not in s: print('skip-missing',label); return
              wr(p,s.replace(a,b,1)); print('fixed',label)

          # AppState
          p='lib/core/app_state.dart'; s=rd(p)
          s=s.replace(
              "Future<void> refreshFromNative() async {\n    if (loading) return;\n    try {\n      await _loadData();",
              "Future<void> refreshFromNative() async {\n    if (loading) return;\n    try {\n      await _saveChain;\n      await _loadData();")
          token="plannerIncludeWeekend = await _prefs.getBool('planner_weekend') ??\n        (legacy['plannerIncludeWeekend'] as bool?) ??\n        true;"
          if 'plannerCapacityMinutes = plannerCapacityMinutes.clamp' not in s and token in s:
              s=s.replace(token,token+"\n    plannerStartHour = plannerStartHour.clamp(0, 23).toInt();\n    plannerEndHour = plannerEndHour.clamp(plannerStartHour + 1, 24).toInt();\n    plannerCapacityMinutes = plannerCapacityMinutes.clamp(60, 16 * 60).toInt();",1)
          s=s.replace(
              "Future<void> setTaskStatus(TaskItem task, String status) async {\n    final wasDone = task.status == 'done';",
              "Future<void> setTaskStatus(TaskItem task, String status) async {\n    if (!const {'todo', 'doing', 'done'}.contains(status)) return;\n    final wasDone = task.status == 'done';")

          old="""  Future<void> addOrUpdateTask(TaskItem task) async {
            final index = data.tasks.indexWhere((e) => e.id == task.id);
            if (index >= 0) {
              data.tasks[index] = task;
            } else {
              data.tasks.add(task);
            }
            notifyListeners();
            await save(syncReminders: false);
            await NativeBridge.syncTaskReminder(task.id);
          }
          """.replace('          ','')
          new="""  Future<void> addOrUpdateTask(TaskItem task) async {
            final index = data.tasks.indexWhere((e) => e.id == task.id);
            final previousDate = index >= 0 ? data.tasks[index].date : null;
            if (index >= 0) {
              data.tasks[index] = task;
            } else {
              data.tasks.add(task);
            }
            _reconcileTaskCompletion(task, previousDate: previousDate);
            notifyListeners();
            await save(syncReminders: false);
            await NativeBridge.syncTaskReminder(task.id);
          }

          void _reconcileTaskCompletion(TaskItem task, {String? previousDate}) {
            if (previousDate != null && previousDate != task.date) {
              data.completions.removeWhere((e) => e.taskId == task.id && e.date == previousDate);
            }
            data.completions.removeWhere((e) => e.taskId == task.id && e.date == task.date);
            if (task.status == 'done') {
              data.completions.add(CompletionItem(
                taskId: task.id,
                title: task.title,
                date: task.date,
                category: task.category,
                minutes: task.minutes,
              ));
            }
          }
          """.replace('          ','')
          if '_reconcileTaskCompletion(TaskItem task' not in s and old in s: s=s.replace(old,new,1)

          recover_old="""  Future<bool> _recoverExpiredFocusIfNeeded() async {
            if (!focusActive || focusEndAt <= 0 || focusRemainingSeconds > 0) {
              return false;
            }
            if (focusEndAt > DateTime.now().millisecondsSinceEpoch) return false;
          """.replace('          ','')
          recover_new="""  Future<bool> _recoverExpiredFocusIfNeeded() async {
            if (!focusActive || !focusRunning || focusEndAt <= 0) return false;
            final now = DateTime.now().millisecondsSinceEpoch;
            if (focusEndAt > now) {
              focusRemainingSeconds = max(0, ((focusEndAt - now) / 1000).ceil());
              return false;
            }
            focusRemainingSeconds = 0;
          """.replace('          ','')
          s=s.replace(recover_old,recover_new,1)

          if 'Finishing immediately should not create' not in s:
              a=s.find('  Future<void> finishFocus({bool completeTask = false}) async {')
              b=s.find('\n  Future<void> cancelFocus()',a)
              if a>=0 and b>a:
                  block="""  Future<void> finishFocus({bool completeTask = false}) async {
                    if (!focusActive) return;
                    final remaining = currentFocusRemainingSeconds();
                    final executedSeconds = max(0, focusPlannedMinutes * 60 - remaining);
                    final actual = min(focusPlannedMinutes, (executedSeconds / 60).round())
                        .clamp(0, focusPlannedMinutes)
                        .toInt();
                    // Finishing immediately should not create a fake minute of focus.
                    if (actual > 0) {
                      data.focusSessions.add(FocusSession(
                        id: DateTime.now().microsecondsSinceEpoch,
                        taskId: focusTaskId,
                        title: focusTitle,
                        date: today,
                        mode: focusMode,
                        plannedMinutes: focusPlannedMinutes,
                        actualMinutes: actual,
                        startedAt: focusStartedAt,
                      ));
                    }
                    var completedTaskId = 0;
                    if (completeTask && focusTaskId != 0) {
                      final task = taskById(focusTaskId);
                      if (task != null && task.status != 'done') {
                        task.status = 'done';
                        _reconcileTaskCompletion(task);
                        completedTaskId = task.id;
                      }
                    }
                    focusActive = false;
                    focusRunning = false;
                    focusRemainingSeconds = 0;
                    focusEndAt = 0;
                    notifyListeners();
                    await NativeBridge.stopFocus();
                    await save(syncReminders: false);
                    if (completedTaskId != 0) await NativeBridge.syncTaskReminder(completedTaskId);
                  }
                """.replace('                ','')
                  s=s[:a]+block+s[b:]
          s=s.replace("if (task.date == today &&\n            task.status != 'done' &&", "if (!task.inbox &&\n            task.date == today &&\n            task.status != 'done' &&")
          wr(p,s)

          # Editor duration
          p='lib/sheets/editors.dart'; s=rd(p)
          s=s.replace('minutes: int.tryParse(_minutes.text) ?? 15,','minutes: duration,',1); wr(p,s)

          # Planner
          p='lib/services/planner_service.dart'; s=rd(p)
          s=s.replace("String? fromDate,\n  }) {\n    final start = fromDate ?? isoDate(DateTime.now());", "String? fromDate,\n    DateTime? now,\n  }) {\n    final clock = now ?? DateTime.now();\n    final currentDate = isoDate(clock);\n    final currentMinute = ((clock.hour * 60 + clock.minute + 4) ~/ 5) * 5;\n    final start = fromDate ?? currentDate;")
          s=s.replace('if (!routine.dueOn(date) || routine.doneOn(date)) continue;', 'if (!routine.dueOn(date)) continue;',1)
          old="if (task.status == 'done' || task.inbox) continue;\n\n      final canMove = task.flexible && task.recurrence == 'none';"
          new="""if (task.inbox) continue;

      if (task.status == 'done') {
        if (task.date.compareTo(start) >= 0 && task.date.compareTo(horizon) <= 0) {
          final mins = max(0, task.minutes);
          load[task.date] = (load[task.date] ?? 0) + mins;
          if (task.time.isNotEmpty) {
            _addOccupied(occupied[task.date]!, task.time, max(15, mins), settings.breakMinutes);
          }
        }
        continue;
      }

      final canMove = task.flexible && task.recurrence == 'none';"""
          s=s.replace(old,new,1)
          calls="settings: settings,\n          startDate: start,\n        );"
          repl="settings: settings,\n          startDate: start,\n          minimumStartMinute: date == currentDate ? currentMinute : settings.startHour * 60,\n        );"
          s=s.replace(calls,repl)
          old="""final over = !best.fits ||
          (load[best.date] ?? 0) + estimate > settings.capacityMinutes ||
          best.time.isEmpty;

      assignments.add(PlannerAssignment(
        taskId: task.id,
        oldDate: task.date,
        oldTime: task.time,
        newDate: best.date,
        newTime: best.time,
        overCapacity: over,
        reason: best.reason,"""
          new="""final originalDeadline = task.deadline.length == 10 ? task.deadline : task.date;
      final missesDeadline = best.date.compareTo(originalDeadline) > 0;
      final over = missesDeadline || !best.fits ||
          (load[best.date] ?? 0) + estimate > settings.capacityMinutes ||
          best.time.isEmpty;
      final assignmentReason = missesDeadline
          ? '${best.reason} Prazo ultrapassado; revise o prazo ou a carga.'
          : best.reason;

      assignments.add(PlannerAssignment(
        taskId: task.id,
        oldDate: task.date,
        oldTime: task.time,
        newDate: best.date,
        newTime: best.time,
        overCapacity: over,
        reason: assignmentReason,"""
          s=s.replace(old,new,1)
          s=s.replace("required String startDate,\n  }) {\n    final period = _preferredPeriod(task);\n    final bounds = _periodBounds(period, settings.startHour * 60, settings.endHour * 60);\n    var slot = _findSlot(occupied, bounds.$1, bounds.$2, estimatedMinutes);", "required String startDate,\n    required int minimumStartMinute,\n  }) {\n    final period = _preferredPeriod(task);\n    final usableStart = max(settings.startHour * 60, minimumStartMinute);\n    final bounds = _periodBounds(period, usableStart, settings.endHour * 60);\n    var slot = _findSlot(occupied, bounds.$1, bounds.$2, estimatedMinutes, settings.breakMinutes);")
          s=s.replace("slot = _findSlot(\n        occupied,\n        settings.startHour * 60,\n        settings.endHour * 60,\n        estimatedMinutes,\n      );", "slot = _findSlot(\n        occupied,\n        usableStart,\n        settings.endHour * 60,\n        estimatedMinutes,\n        settings.breakMinutes,\n      );")
          s=s.replace("int minutes,\n  ) {\n    if (dayEnd <= dayStart || minutes <= 0) return '';\n    var cursor = dayStart;\n    for (final interval in list) {\n      if (interval.end <= dayStart || interval.start >= dayEnd) continue;\n      if (cursor + minutes <= interval.start) return _formatMinutes(cursor);", "int minutes,\n    int breakMinutes,\n  ) {\n    if (dayEnd <= dayStart || minutes <= 0) return '';\n    final gap = max(0, breakMinutes);\n    var cursor = dayStart;\n    for (final interval in list) {\n      if (interval.end <= dayStart || interval.start >= dayEnd) continue;\n      if (cursor + minutes + gap <= interval.start) return _formatMinutes(cursor);",1)
          wr(p,s)

          # Android native data and stale actions
          p='android/app/src/main/java/com/ritmo/mobile/Store.java'; s=rd(p)
          s=s.replace('tasks.clear(); goals.clear(); routines.clear(); completions.clear(); projects.clear(); focusSessions.clear(); dayReviews.clear();\n            seed(); save();','tasks.clear(); goals.clear(); routines.clear(); completions.clear(); projects.clear(); focusSessions.clear(); dayReviews.clear();',1)
          s=s.replace('if (t.date.compareTo(start) < 0 || t.date.compareTo(today()) > 0) continue;\n            total++; if ("done".equals(t.status)) done++;','if (t.inbox || t.date.compareTo(start) < 0 || t.date.compareTo(today()) > 0) continue;\n            total++; if ("done".equals(t.status)) done++;',1); wr(p,s)

          p='android/app/src/main/java/com/ritmo/mobile/ReminderReceiver.java'; s=rd(p)
          s=s.replace('if (task != null && !"done".equals(task.status)) store.setTaskStatus(task, "done");','if (task != null && !task.inbox && !"done".equals(task.status)) store.setTaskStatus(task, "done");',1)
          s=s.replace('if (routine != null && !routine.doneOn(Store.today())) {','if (routine != null && routine.dueOn(Store.today()) && !routine.doneOn(Store.today())) {',1)
          s=s.replace('if (routine != null) RoutineReminderScheduler.scheduleAt(context, routine, System.currentTimeMillis() + 10 * 60_000L);','if (routine != null && routine.dueOn(Store.today())) RoutineReminderScheduler.scheduleAt(context, routine, System.currentTimeMillis() + 10 * 60_000L);',1); wr(p,s)

          p='android/app/src/main/java/com/ritmo/mobile/RoutineReminderScheduler.java'; s=rd(p)
          s=s.replace('if (routine == null || routine.doneOn(Store.today()) || when <= System.currentTimeMillis()) return;','if (routine == null || !routine.dueOn(Store.today()) || routine.doneOn(Store.today()) || when <= System.currentTimeMillis()) return;',1); wr(p,s)

          # Regression tests
          p='test/planner_service_test.dart'; s=rd(p)
          if 'planner does not schedule in elapsed time' not in s:
              extra=r'''

  test('planner does not schedule in elapsed time', () {
    final data = RitmoData(tasks: [TaskItem(id: 20, title: 'Agora', date: '2026-08-18', deadline: '2026-08-18', flexible: true, minutes: 30)]);
    final result = PlannerService.plan(data, const PlannerSettings(startHour: 8, endHour: 18, horizonDays: 1), fromDate: '2026-08-18', now: DateTime(2026, 8, 18, 11, 7));
    expect(result.assignments.single.newTime.compareTo('11:10') >= 0, isTrue);
  });

  test('planner preserves configured break before fixed work', () {
    final data = RitmoData(tasks: [
      TaskItem(id: 30, title: 'Fixa', date: '2026-08-18', time: '09:00', minutes: 60),
      TaskItem(id: 31, title: 'Flex', date: '2026-08-18', deadline: '2026-08-18', flexible: true, minutes: 60),
    ]);
    final result = PlannerService.plan(data, const PlannerSettings(startHour: 8, endHour: 13, horizonDays: 1, breakMinutes: 10), fromDate: '2026-08-18', now: DateTime(2026, 8, 18, 7));
    expect(result.assignments.single.newTime, '10:10');
  });

  test('planner warns when assignment passes deadline', () {
    final data = RitmoData(tasks: [TaskItem(id: 40, title: 'Prazo', date: '2026-08-22', deadline: '2026-08-22', flexible: true, minutes: 30)]);
    final result = PlannerService.plan(data, const PlannerSettings(startHour: 8, endHour: 18, horizonDays: 3, includeWeekend: false), fromDate: '2026-08-22', now: DateTime(2026, 8, 22, 7));
    final a=result.assignments.single;
    expect(a.newDate, '2026-08-24');
    expect(a.overCapacity, isTrue);
    expect(a.reason, contains('Prazo ultrapassado'));
  });

  test('completed work consumes planner capacity', () {
    final data = RitmoData(tasks: [
      TaskItem(id: 50, title: 'Feita', date: '2026-08-18', time: '08:00', status: 'done', minutes: 300),
      TaskItem(id: 51, title: 'Nova', date: '2026-08-18', deadline: '2026-08-18', flexible: true, minutes: 120),
    ]);
    final result = PlannerService.plan(data, const PlannerSettings(startHour: 8, endHour: 18, capacityMinutes: 360, horizonDays: 1), fromDate: '2026-08-18', now: DateTime(2026, 8, 18, 7));
    expect(result.assignments.single.overCapacity, isTrue);
    expect(result.loadMinutes['2026-08-18'], greaterThan(360));
  });
'''
              i=s.rfind('\n}'); s=s[:i]+extra+s[i:]; wr(p,s)

          # Version and docs
          p='pubspec.yaml'; s=rd(p); s=re.sub(r'^version:.*$','version: 3.4.2+14',s,flags=re.M); wr(p,s)
          p='android/app/build.gradle'; s=rd(p); s=re.sub(r'\?: "13"','?: "14"',s,1); s=s.replace('?: "3.4.1"','?: "3.4.2"'); wr(p,s)
          p='lib/screens/settings_page.dart'; wr(p,rd(p).replace('Ritmo 3.4.1','Ritmo 3.4.2'))
          p='README.md'; s=rd(p).replace('versão-3.4.1-','versão-3.4.2-').replace('Versão atual: **3.4.1 —','Versão atual: **3.4.2 —').replace('Ritmo-v3.4.1','Ritmo-v3.4.2').replace('Na versão 3.4.1','Na versão 3.4.2').replace('A versão 3.4.1 possui builds','A versão 3.4.2 possui builds').replace('Ritmo 3.4.1\nversionCode: 12','Ritmo 3.4.2\nversionCode: 14').replace('Ritmo 3.4.1\nversionCode: 13','Ritmo 3.4.2\nversionCode: 14'); wr(p,s)
          p='CHANGELOG.md'; s=rd(p)
          if '## 3.4.2 — Reliability & Logic Polish' not in s:
              entry='''## 3.4.2 — Reliability & Logic Polish

- Persistência e refresh protegidos contra snapshots antigos e dados nativos corrompidos.
- Histórico de conclusão reconciliado ao editar tarefas concluídas.
- Foco sem minuto fantasma e recuperação por relógio real.
- Smart Planner respeita horário atual, intervalos, capacidade já consumida e estouro de prazo.
- Ações obsoletas de notificações deixam de alterar Inbox ou hábitos fora da ocorrência atual.
- Duração de hábitos usa o valor validado e limitado pelo editor.
- Novos testes de regressão para o Planner e pipelines de release com testes.

'''
              s=s.replace('# Changelog\n\n','# Changelog\n\n'+entry,1); wr(p,s)
          PY

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Commit
        shell: bash
        run: |
          git config user.name "VictorAms12"
          git config user.email "victoralexandresoaresmaranhao@gmail.com"
