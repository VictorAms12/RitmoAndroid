name: Focus Inbox Hotfix

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ contains(github.event.head_commit.message, 'execute focus Inbox hotfix') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - name: Exclude Inbox from focus task selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/focus_page.dart')
          text = p.read_text(encoding='utf-8')
          old = "    final openTasks = state.data.tasks.where((e) => e.status != 'done').toList()"
          new = "    final openTasks = state.data.tasks\n        .where((e) => !e.inbox && e.status != 'done')\n        .toList()"
          if old not in text:
              raise SystemExit('expected focus task selector not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Validate
        shell: bash
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Commit
        shell: bash
        run: |
          git config user.name "VictorAms12"
          git config user.email "victoralexandresoaresmaranhao@gmail.com"
          git add lib/screens/focus_page.dart
          git commit -m "fix: keep Inbox tasks out of focus selector"
          git push origin main
