name: Apply Ritmo 3.0.2 Theme

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  apply-theme:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply theme redesign
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'lib/core/theme.dart': [
                  ('static const success = Color(0xFF35C48D);', 'static const success = Color(0xFF63A6F5);'),
                  ('static const mint = Color(0xFF35C48D);', 'static const mint = Color(0xFF63A6F5);'),
              ],
              'lib/screens/today_page.dart': [
                  ('? const [Color(0xFF0D3025), Color(0xFF124835)]', '? const [Color(0xFF181A24), Color(0xFF303764)]'),
                  (': const [Color(0xFF166B52), Color(0xFF238362)],', ': const [Color(0xFF5965E8), Color(0xFF7768E8)],'),
              ],
              'lib/screens/shell.dart': [
                  ('color: dark ? const Color(0xFF0A211A) : Colors.white,', 'color: dark ? const Color(0xFF111317) : Colors.white,'),
              ],
              'lib/screens/progress_page.dart': [
                  ('Quanto mais intenso o verde, maior foi a combinação de tarefas e hábitos concluídos naquele dia.', 'Quanto mais intensa a cor, maior foi a combinação de tarefas e hábitos concluídos naquele dia.'),
              ],
              'lib/models/models.dart': [
                  ("this.accent = 'green',", "this.accent = 'indigo',"),
                  ("accent: (j['accent'] ?? 'green').toString(),", "accent: (j['accent'] ?? 'indigo').toString(),"),
              ],
              'lib/sheets/editors.dart': [
                  ("accent: old?.accent ?? 'green',", "accent: old?.accent ?? 'indigo',"),
              ],
              'lib/screens/settings_page.dart': [
                  ("title: const Text('Ritmo 3.0.0'),", "title: const Text('Ritmo 3.0.2'),"),
                  ("title: const Text('Ritmo 3.0.1'),", "title: const Text('Ritmo 3.0.2'),"),
              ],
              'pubspec.yaml': [
                  ('version: 3.0.1+9', 'version: 3.0.2+10'),
                  ('version: 3.0.0+8', 'version: 3.0.2+10'),
              ],
              'android/app/build.gradle': [
                  ('flutter.versionCode") ?: "9"', 'flutter.versionCode") ?: "10"'),
                  ('flutter.versionCode") ?: "8"', 'flutter.versionCode") ?: "10"'),
                  ('flutter.versionName") ?: "3.0.1"', 'flutter.versionName") ?: "3.0.2"'),
                  ('flutter.versionName") ?: "3.0.0"', 'flutter.versionName") ?: "3.0.2"'),
              ],
          }

          changed = []
          for name, pairs in replacements.items():
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(name)

          print('Changed files:')
          for name in changed:
              print('-', name)
          PY

      - name: Commit theme changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No theme changes were needed."
            exit 0
          fi
          git config user.name "Ritmo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: Ritmo 3.0.2 remove verde residual [skip ci]"
          git push origin main
