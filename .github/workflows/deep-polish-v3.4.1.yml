name: Deep Ritmo 3.4.1 Polish

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ contains(github.event.head_commit.message, 'execute deep Ritmo 3.4.1 polish') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - name: Apply deep polish
        run: python .github/scripts/deep_polish_v3_4_1.py

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Configure Android build
        shell: bash
        run: |
          cat > android/local.properties <<EOF2
          flutter.sdk=$FLUTTER_ROOT
          flutter.versionCode=13
          flutter.versionName=3.4.1
          EOF2

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile signed Android release
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Commit
        shell: bash
        run: |
          git config user.name "VictorAms12"
          git config user.email "victoralexandresoaresmaranhao@gmail.com"
          git add -A
          git reset -- .github/workflows/deep-polish-v3.4.1.yml
          git commit -m "fix: final Ritmo 3.4.1 reliability and performance polish"
          git push origin main
