name: Apply Ritmo 3.4 Upgrade

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ contains(github.event.head_commit.message, 'Ritmo 3.4 migration') }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - name: Generate Windows platform
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ritmo_windows_template"
          flutter create --platforms=windows --project-name ritmo "$RUNNER_TEMP/ritmo_windows_template"
          rm -rf windows
          cp -R "$RUNNER_TEMP/ritmo_windows_template/windows" windows

      - name: Apply 3.4 source upgrade
        shell: bash
        run: python .github/scripts/apply_v3_4.py

      - name: Validate Flutter source
        shell: bash
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name "VictorAms12"
          git config user.email "victoralexandresoaresmaranhao@gmail.com"
          git add -A
          git reset -- .github/workflows/build-apk.yml .github/workflows/build-windows.yml
          git commit -m "feat: Ritmo 3.4.0 Windows e notificacoes seguras"
          git push origin main
