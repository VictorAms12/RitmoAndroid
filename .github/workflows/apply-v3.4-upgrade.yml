'''
          write('CHANGELOG.md', entry + body)

          print('Ritmo 3.4 source migration complete')
          PY

      - name: Validate Flutter source
        shell: bash
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name "VictorAms12"
          git config user.email "victoralexandresoaresmaranhao@gmail.com"
          git add -A
          git commit -m "feat: Ritmo 3.4.0 Windows e notificacoes seguras"
          git push origin main
