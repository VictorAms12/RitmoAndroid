name: Final Ritmo 3.4.3 Polish

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ contains(github.event.head_commit.message, 'run final Ritmo 3.4.3 polish') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply final polish
        run: |
          python .github/scripts/final_polish_3_4_3.py
          python .github/scripts/post_polish_3_4_3.py

      - name: Format Dart
        run: dart format lib test

      - name: Fetch packages
        run: flutter pub get

      - name: Configure Android local.properties
        shell: bash
        run: |
          cat > android/local.properties <<EOF2
          flutter.sdk=$FLUTTER_ROOT
          flutter.versionCode=15
          flutter.versionName=3.4.3
          EOF2

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Compile Android debug
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "Ritmo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset -- android/local.properties
          git reset -- .github/workflows
          git reset -- .github/scripts/final_polish_3_4_3.py
          git reset -- .github/scripts/post_polish_3_4_3.py
          git reset -- .github/scripts/final_tidy_3_4_2.py
          git commit -m "perf: Ritmo 3.4.3 final reliability and speed polish"
          git push origin main
