name: Final Ritmo 3.4.3 Polish

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ contains(github.event.head_commit.message, 'run final Ritmo 3.4.3 polish') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply and validate final polish
        shell: bash
        run: |
          set +e
          rm -f /tmp/ritmo-audit.log
          {
            echo '=== PATCH ==='
            python .github/scripts/final_polish_3_4_3.py
            PATCH_RC=$?
            if [ $PATCH_RC -ne 0 ]; then exit $PATCH_RC; fi
            python .github/scripts/post_polish_3_4_3.py
            PATCH_RC=$?
            if [ $PATCH_RC -ne 0 ]; then exit $PATCH_RC; fi
            dart format lib test
            FORMAT_RC=$?
            if [ $FORMAT_RC -ne 0 ]; then exit $FORMAT_RC; fi
            flutter pub get
            PUB_RC=$?
            if [ $PUB_RC -ne 0 ]; then exit $PUB_RC; fi
            cat > android/local.properties <<EOF2
          flutter.sdk=$FLUTTER_ROOT
          flutter.versionCode=15
          flutter.versionName=3.4.3
          EOF2
            echo '=== ANALYZE ==='
            flutter analyze --no-fatal-infos --no-fatal-warnings
            ANALYZE_RC=$?
            if [ $ANALYZE_RC -ne 0 ]; then exit $ANALYZE_RC; fi
            echo '=== TEST ==='
            flutter test
            TEST_RC=$?
            if [ $TEST_RC -ne 0 ]; then exit $TEST_RC; fi
            echo '=== ANDROID ==='
            (cd android && gradle --no-daemon assembleDebug)
            BUILD_RC=$?
            exit $BUILD_RC
          } > /tmp/ritmo-audit.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            {
              echo '# Ritmo temporary audit failure'
              echo
              echo "Exit code: $RC"
              echo
              echo '```text'
              tail -n 120 /tmp/ritmo-audit.log
              echo '```'
            } > AUDIT_FAILURE.md
            git config user.name "Ritmo Automation"
            git config user.email "actions@users.noreply.github.com"
            git add AUDIT_FAILURE.md
            git commit -m "chore: capture Ritmo 3.4.3 audit failure [skip ci]"
            git push origin main
            exit $RC
          fi
          git config user.name "Ritmo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset -- android/local.properties
          git reset -- .github/workflows
          git reset -- .github/scripts/final_polish_3_4_3.py
          git reset -- .github/scripts/post_polish_3_4_3.py
          git reset -- .github/scripts/final_tidy_3_4_2.py
          git commit -m "perf: Ritmo 3.4.3 final reliability and speed polish"
          git push origin main
