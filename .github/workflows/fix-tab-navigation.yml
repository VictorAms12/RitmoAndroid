name: Apply Tab Navigation Smoothness Fix

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: smooth distant tab navigation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch shell navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/shell.dart')
          text = path.read_text(encoding='utf-8')

          old_fields = """class _RitmoShellState extends State<RitmoShell> {\n  int _index = 0;\n  late final PageController _pages = PageController();"""
          new_fields = """class _RitmoShellState extends State<RitmoShell> {\n  int _index = 0;\n  bool _tabTransitioning = false;\n  late final PageController _pages = PageController();"""

          old_select = """  void _select(int value) {\n    if (value == _index) return;\n    setState(() => _index = value);\n    if (widget.state.reduceMotion) {\n      _pages.jumpToPage(value);\n    } else {\n      _pages.animateToPage(\n        value,\n        duration: const Duration(milliseconds: 330),\n        curve: Curves.easeOutCubic,\n      );\n    }\n  }"""
          new_select = """  Future<void> _select(int value) async {\n    if (value == _index || _tabTransitioning || !_pages.hasClients) return;\n\n    final current = (_pages.page ?? _index.toDouble()).round();\n\n    if (widget.state.reduceMotion) {\n      setState(() => _index = value);\n      _pages.jumpToPage(value);\n      return;\n    }\n\n    setState(() {\n      _index = value;\n      _tabTransitioning = true;\n    });\n\n    try {\n      final distance = (value - current).abs();\n\n      // PageView animando 2-3 paginas de uma vez precisa montar todas as\n      // telas intermediarias e pode engasgar. Para saltos longos, pula\n      // silenciosamente para a pagina vizinha ao destino e anima apenas\n      // o ultimo trecho. Visualmente continua parecendo uma transicao\n      // natural, mas sem atravessar varias telas pesadas.\n      if (distance > 1) {\n        final bridgePage = value > current ? value - 1 : value + 1;\n        _pages.jumpToPage(bridgePage);\n        await WidgetsBinding.instance.endOfFrame;\n        if (!mounted || !_pages.hasClients) return;\n      }\n\n      await _pages.animateToPage(\n        value,\n        duration: const Duration(milliseconds: 240),\n        curve: Curves.easeOutCubic,\n      );\n    } finally {\n      if (mounted) {\n        setState(() => _tabTransitioning = false);\n      }\n    }\n  }"""

          old_changed = """            onPageChanged: (value) => setState(() => _index = value),"""
          new_changed = """            onPageChanged: (value) {\n              if (_tabTransitioning || value == _index) return;\n              setState(() => _index = value);\n            },"""

          for old, new, label in [
              (old_fields, new_fields, 'state fields'),
              (old_select, new_select, 'tab selector'),
              (old_changed, new_changed, 'page callback'),
          ]:
              if new in text:
                  print(f'already applied: {label}')
                  continue
              if old not in text:
                  raise SystemExit(f'expected block not found: {label}')
              text = text.replace(old, new, 1)
              print(f'updated: {label}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit navigation fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No navigation changes were needed."
            exit 0
          fi
          git config user.name "Ritmo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/shell.dart
          git commit -m "fix: smooth distant tab navigation"
          git push origin main
