name: Ritmo 3.4.2 Comprehensive Polish

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ contains(github.event.head_commit.message, 'run comprehensive Ritmo 3.4.2 polish') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Apply audited fixes
        run: python .github/scripts/comprehensive_polish_3_4_2.py

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Commit polished source
        shell: bash
        run: |
          git config user.name "Ritmo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          git reset -- .github/scripts/comprehensive_polish_3_4_2.py
          git commit -m "fix: Ritmo 3.4.2 comprehensive reliability polish"
          git push origin main
